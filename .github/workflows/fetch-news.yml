name: Fetch Civic News

on:
  schedule:
    # Runs every day at 07:00 UTC (08:00 CET / 09:00 CEST)
    - cron: '0 7 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch news from Google News RSS
        run: npx tsx scripts/fetch-news.ts --write

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/news.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Busssola News Bot"
          git config user.email "bot@busssola.com"
          git add src/data/news.ts
          ITEM_COUNT=$(git diff --cached --numstat src/data/news.ts | awk '{print int($1/20)}')
          DATE=$(date +%Y-%m-%d)
          git commit -m "chore(news): auto-import notizie civiche ${DATE}

          Imported from Google News RSS. Items marked [BOZZA] require editorial review.
          [skip ci]"
          git push
